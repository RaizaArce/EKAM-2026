.url{margin-top:30px;display:inline-block;padding:10px 20px;border-radius:999px;background:#123B63;color:#fff;font-weight:600;font-size:20px;letter-spacing:.02em}
svg{width:560px;height:auto;display:block}
.hero-scene__pulses{display:none}
